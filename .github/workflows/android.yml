name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run android:sync

      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "avtostavka-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: avtostavka-apk-${{ github.run_number }}
          path: avtostavka-*.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Avtostavka Android ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: avtostavka-*.apk
          body: |
            APK zur Direktinstallation auf Android 7+.
            Установка: скачать файл .apk на телефон → открыть → разрешить установку из этого источника.
            Ветка: ${{ github.ref_name }}, коммит ${{ github.sha }}
